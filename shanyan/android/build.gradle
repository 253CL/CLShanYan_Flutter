group 'com.shanyan'
version '1.0'

buildscript {
    repositories {
        google()
        jcenter()
        mavenCentral()

    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
    }
}

rootProject.allprojects {
    repositories {
        google()
        jcenter()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace = "com.shanyan"

    compileSdkVersion 31

    defaultConfig {
        minSdkVersion 16
        consumerProguardFiles "consumer-rules.pro"
    }
    lintOptions {
        checkReleaseBuilds false
    }
}
dependencies {
    api files('libs/shanyan_sdk_v2.3.7.1_flutter.jar')
}